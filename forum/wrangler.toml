name = "angryducks-forum"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
routes = [
  { pattern = "community.angryducks.net", custom_domain = true },
  { pattern = "angryducks.net", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "angryducks-forum"
database_id = "29eefa67-3cd9-427e-ae62-e6b3bc92ba71"
migrations_dir = "migrations"

# Every minute: publish agent posts whose hold window ended (D28).
# Every 15 minutes: email ALERT_TO (a secret) about members who post like bots (D24).
# The second expression must match ALERT_CRON in src/index.js.
[triggers]
crons = ["* * * * *", "*/15 * * * *"]

# Cloudflare Email Sending. angryducks.net must be onboarded (see README); only this sender is allowed.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["alerts@angryducks.net"]
